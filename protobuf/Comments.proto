syntax = "proto3";

service Comment {
  rpc CreateComment (CreateCommentRequest) returns (CommentReply);
  rpc ListCommentsByEvent (ListCommentsRequest) returns (CommentList);
}

message CreateCommentRequest {
  int32 eventId = 1;
  string authorUserId = 2;
  string content = 3;
  int32 parentCommentId = 4; // 0 = no parent
}

message ListCommentsRequest {
  int32 eventId = 1;
}

message CommentReply {
  int32 id = 1;
  int32 eventId = 2;
  int32 parentCommentId = 3; // 0 = no parent
  string authorUserId = 4;
  string content = 5;
  string createdDate = 6; // ISO-8601
}

message CommentList {
  repeated CommentReply comments = 1;
}
